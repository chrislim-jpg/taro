<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>타로티카 | 나를 돌아보는 AI 타로</title>
  <meta name="description" content="매일 한 장의 타로와 AI 심층 리딩으로 내 마음을 돌아보는 모바일 타로 서비스" />
  <meta name="keywords" content="타로, 타로티카, 오늘의 운세, AI 타로, 무료 타로, 모바일 타로" />
  <meta name="author" content="타로티카" />

  <!-- PWA & Theme Color -->
  <meta name="theme-color" content="#2877f5" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Open Graph / SNS 공유 -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:site_name" content="타로티카 (Tarotica)" />
  <meta property="og:title" content="타로티카 | 나를 돌아보는 AI 타로" />
  <meta property="og:description" content="매일 한 장의 타로와 AI 심층 리딩으로 내 마음을 돌아보는 모바일 타로 서비스" />
  <meta property="og:image" content="/favicon.svg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="타로티카 | 나를 돌아보는 AI 타로" />
  <meta name="twitter:description" content="매일 한 장의 타로와 AI 심층 리딩으로 내 마음을 돌아보는 모바일 타로 서비스" />
  <meta name="twitter:image" content="/favicon.svg" />

  <!-- Web Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      background: #eef1f5;
      color: #191f28;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .app {
      width: 100%;
      max-width: 412px;
      min-height: 100vh;
      margin: auto;
      background: #fff;
      position: relative;
      padding-bottom: 94px;
    }
    button, textarea {
      font: inherit;
    }
    button {
      cursor: pointer;
    }
    .top {
      height: 68px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
    }
    .top .back {
      border: 0;
      background: none;
      font-size: 24px;
      padding: 8px;
      margin-left: -10px;
      cursor: pointer;
    }
    .credit {
      margin-left: auto;
      border: 0;
      border-radius: 999px;
      padding: 7px 11px;
      background: #f5f6f8;
      font-weight: 700;
      cursor: pointer;
    }
    .credit b {
      color: #2877f5;
    }
    .main {
      padding: 14px 24px 30px;
    }
    h1 {
      font-size: 28px;
      line-height: 1.52;
      letter-spacing: -1.2px;
      margin: 0;
    }
    h2 {
      font-size: 20px;
      margin: 0;
    }
    p {
      margin: 0;
    }
    .muted {
      color: #616d7c;
      font-size: 13px;
      line-height: 1.65;
    }
    .date {
      display: flex;
      justify-content: space-between;
      color: #616d7c;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .stage {
      height: 280px;
      border-radius: 22px;
      background: #f2f6fc;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      margin: 24px 0 16px;
    }
    .stage:before, .stage:after {
      content: '';
      position: absolute;
      width: 330px;
      height: 130px;
      border: 1px solid #cfddf1;
      border-radius: 50%;
    }
    .stage:after {
      transform: rotate(72deg);
      width: 220px;
      height: 220px;
    }
    .badge {
      position: absolute;
      top: 16px;
      left: 16px;
      background: #edf4ff;
      color: #195ac4;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      z-index: 3;
    }
    .card {
      width: 110px;
      height: 176px;
      border: 6px solid #19365e;
      border-radius: 10px;
      background: #19365e;
      box-shadow: 0 8px 24px #19365e20;
      position: relative;
      z-index: 2;
    }
    .card:before {
      content: '☾';
      position: absolute;
      inset: 7px;
      border: 1px solid #a8bed6;
      border-radius: 6px;
      color: #faf3df;
      font: 70px/150px serif;
      text-align: center;
    }
    .card:after {
      content: '✦';
      position: absolute;
      color: #e8b85d;
      font-size: 28px;
      left: 41px;
      bottom: 28px;
    }
    .btn {
      width: 100%;
      height: 56px;
      border: 0;
      border-radius: 16px;
      background: #2877f5;
      color: white;
      font-weight: 700;
      font-size: 16px;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn.light {
      background: #edf4ff;
      color: #195ac4;
    }
    .btn:disabled {
      background: #d7dce2;
      cursor: not-allowed;
      transform: none;
    }
    .center {
      text-align: center;
    }
    .note {
      font-size: 11px;
      color: #8b95a1;
      text-align: center;
      margin: 9px 0 24px;
    }
    .panel {
      background: #f5f6f8;
      border-radius: 22px;
      padding: 20px;
      margin: 16px 0;
    }
    .panel strong {
      display: block;
      margin-bottom: 5px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .row .grow {
      flex: 1;
    }
    .link {
      color: #2877f5;
      font-weight: 700;
    }
    .nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 412px;
      height: 82px;
      border-top: 1px solid #eaecef;
      background: #fff;
      display: flex;
      padding: 8px 22px 18px;
      z-index: 9;
    }
    .nav button {
      flex: 1;
      border: 0;
      background: none;
      color: #8b95a1;
      font-size: 11px;
    }
    .nav button.on {
      color: #2877f5;
      font-weight: 700;
    }
    .nav i {
      display: block;
      font-style: normal;
      font-size: 20px;
    }
    .progress {
      display: flex;
      gap: 7px;
      align-items: center;
      color: #616d7c;
      font-size: 12px;
      font-weight: 700;
      margin: 10px 0 22px;
    }
    .progress i {
      width: 28px;
      height: 4px;
      background: #eaecef;
      border-radius: 3px;
    }
    .progress i.on {
      background: #2877f5;
    }
    .chips {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 28px 0;
    }
    .chips button {
      height: 51px;
      border: 0;
      border-radius: 13px;
      background: #f5f6f8;
      text-align: left;
      padding: 0 14px;
      color: #616d7c;
    }
    .chips button.on {
      border: 2px solid #2877f5;
      background: #edf4ff;
      color: #195ac4;
      font-weight: 700;
    }
    .field {
      margin-top: 28px;
    }
    .field label {
      display: block;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .field textarea {
      width: 100%;
      height: 184px;
      border: 2px solid #2877f5;
      border-radius: 17px;
      padding: 16px;
      resize: none;
      line-height: 1.65;
      font-family: inherit;
    }
    .cost {
      display: flex;
      justify-content: space-between;
      margin: 28px 0;
      padding: 18px;
      background: #f5f6f8;
      border-radius: 18px;
    }
    .cost small {
      display: block;
      color: #616d7c;
      margin-top: 6px;
    }
    .slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 18px 0 30px;
    }
    .slot {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }
    .slot .card {
      width: 92px;
      height: 147px;
      margin: 8px auto;
      border: 5px solid #2877f5;
    }
    .deck {
      display: flex;
      justify-content: center;
      height: 145px;
      margin: 20px 0;
    }
    .deck .card {
      width: 75px;
      height: 120px;
      margin-left: -18px;
    }
    .deck .card:first-child {
      margin-left: 0;
    }
    .art {
      height: 260px;
      border-radius: 22px;
      background: #fbf6e9;
      display: grid;
      place-items: center;
      margin: 22px 0;
    }
    .sun {
      width: 110px;
      height: 176px;
      border: 1px solid #e8d7aa;
      background: #fff9e9;
      border-radius: 7px;
      display: grid;
      place-items: center;
      color: #e8b85d;
      font-size: 66px;
    }
    .read {
      padding: 18px 0;
      border-bottom: 1px solid #eaecef;
    }
    .read strong {
      display: block;
      margin-bottom: 7px;
    }
    .advice {
      background: #edf4ff;
      border-radius: 18px;
      padding: 18px;
      margin: 20px 0;
      line-height: 1.6;
    }
    .three {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 24px 0;
    }
    .three .card {
      width: 78px;
      height: 125px;
    }
    .history {
      width: 100%;
      border: 0;
      background: #f5f6f8;
      border-radius: 20px;
      padding: 17px;
      text-align: left;
      margin: 10px 0;
      cursor: pointer;
    }
    .history small {
      color: #2877f5;
      font-weight: 700;
    }
    .history strong {
      display: block;
      margin: 10px 0;
    }
    .share {
      width: 292px;
      min-height: 518px;
      background: #faf3df;
      border-radius: 22px;
      margin: 22px auto;
      padding: 24px 20px;
      color: #19365e;
      box-shadow: 0 14px 30px #19365e18;
    }
    .share h2 {
      font-size: 22px;
      line-height: 1.5;
      margin: 20px 0;
    }
    .toggle {
      display: flex;
      justify-content: space-between;
      background: #f5f6f8;
      border-radius: 16px;
      padding: 16px;
      margin: 18px 0;
      cursor: pointer;
    }
    .switch {
      width: 43px;
      height: 26px;
      border-radius: 20px;
      background: #d7dce2;
      padding: 3px;
      transition: background 0.2s ease;
    }
    .switch.on {
      background: #2877f5;
    }
    .switch:after {
      content: '';
      display: block;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      transform: translateX(0);
      transition: transform 0.2s ease;
    }
    .switch.on:after {
      transform: translateX(17px);
    }
    .balance {
      background: #edf4ff;
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 26px;
    }
    .balance b {
      display: block;
      font-size: 30px;
      margin: 3px 0;
    }
    .product {
      width: 100%;
      height: 84px;
      border: 1px solid #eaecef;
      border-radius: 17px;
      background: #fff;
      padding: 16px;
      display: flex;
      align-items: center;
      text-align: left;
      margin: 10px 0;
      cursor: pointer;
    }
    .product.on {
      border: 2px solid #2877f5;
      background: #edf4ff;
    }
    .product span {
      flex: 1;
      margin-left: 12px;
    }
    .days {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      margin: 28px 0;
    }
    .day {
      height: 112px;
      background: #f5f6f8;
      border-radius: 17px;
      text-align: center;
      padding: 13px 5px;
      color: #616d7c;
      font-size: 12px;
    }
    .day b {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #e5efff;
      color: #2877f5;
      margin: 8px auto;
    }
    .day.today {
      border: 2px solid #2877f5;
      background: #edf4ff;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 100px;
      transform: translateX(-50%);
      background: #191f28;
      color: #fff;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 13px;
      z-index: 99;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      animation: fadeInOut 1.8s forwards;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translate(-50%, 10px); }
      15% { opacity: 1; transform: translate(-50%, 0); }
      85% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -10px); }
    }
    @media (min-width: 700px) {
      .app {
        box-shadow: 0 0 60px #19365e18;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // 전역 애플리케이션 상태 (Global State)
    const S = {
      screen: 'home',
      credits: 15,
      category: '진로/이직',
      question: '최근 이직을 고민하고 있어요. 지금 회사에 남는 게 좋을까요, 새로운 기회를 찾는 게 좋을까요?',
      include: false,
      claimed: false,
      product: 100
    };

    // 상단 네비게이션 헤더
    const top = (title = '타로티카', back = false) => `
      <header class="top">
        ${back ? '<button class="back" data-go="home" aria-label="뒤로가기">‹</button>' : ''}
        <span>${title}</span>
        <button class="credit" data-go="store" aria-label="크레딧 상점">
          <b>ⓢ</b> ${S.credits}
        </button>
      </header>
    `;

    // 하단 탭 네비게이션
    const nav = (a) => `
      <nav class="nav" aria-label="하단 메뉴">
        ${[
          ['home', '⌂', '홈'],
          ['archive', '▱', '보관함'],
          ['store', '▢', '상점']
        ].map(x => `
          <button data-go="${x[0]}" class="${a === x[0] ? 'on' : ''}">
            <i>${x[1]}</i>${x[2]}
          </button>
        `).join('')}
      </nav>
    `;

    // 타로 카드 그래픽
    const card = () => '<div class="card" aria-hidden="true"></div>';

    // 진행 단계 인디케이터
    const progress = (n) => `
      <div class="progress" aria-label="${n}단계 진행 중">
        <i class="on"></i>
        <i class="${n > 1 ? 'on' : ''}"></i>
        <i class="${n > 2 ? 'on' : ''}"></i>
        <span>${n} / 3단계</span>
      </div>
    `;

    // [1] 홈 화면
    function home() {
      return top() + `
        <main class="main">
          <div class="date">
            <span>2026.10.23 금요일</span>
            <span>무료 5 · 유료 10</span>
          </div>
          <h1>오늘의 나에게<br>어떤 이야기가 필요할까요?</h1>
          <div class="stage">
            <span class="badge">하루 한 번</span>
            ${card()}
          </div>
          <button class="btn" data-go="daily">오늘의 타로 무료로 뽑기</button>
          <p class="note">크레딧 없이, 하루 한 번 무료로 볼 수 있어요</p>
          <button class="panel" data-go="question" style="width:100%;border:0;text-align:left">
            <strong>마음에 걸리는 고민이 있나요?</strong>
            <p class="muted">세 장으로 과거·현재·미래를 살펴봐요</p>
            <p style="margin:14px 0">연애　 진로　 인간관계</p>
            <span class="link">AI 심층 타로 보기</span>
            <b style="float:right">10크레딧</b>
          </button>
          <button class="panel row" data-go="attendance" style="width:100%;border:0;text-align:left">
            <span>▣</span>
            <span class="grow">
              <strong>출석하고 크레딧 받아요</strong>
              <small class="muted">매일 2크레딧 · 7일 연속이면 추가 10크레딧</small>
            </span>
            ›
          </button>
        </main>
        ${nav('home')}
      `;
    }

    // [2] 오늘의 타로 (일일 리딩)
    function daily() {
      return top('오늘의 리딩', true) + `
        <main class="main">
          <p class="muted">오늘의 타로 · 2026.10.23</p>
          <h1>작은 용기가<br>하루를 환하게 비춰줄 거예요</h1>
          <div class="art">
            <div class="sun">☀</div>
          </div>
          <div class="center">
            <b>태양　<small class="muted">THE SUN　정방향</small></b>
          </div>
          ${[
            ['오늘의 총운', '작은 일에서도 자신감을 발견할 수 있는 날이에요. 미뤄 둔 일을 가볍게 시작해 보세요.'],
            ['연애운', '솔직한 표현이 마음의 거리를 좁히는 데 도움이 될 수 있어요.'],
            ['금전운', '새로운 소비보다 이미 가진 것을 살펴보면 좋겠어요.']
          ].map(x => `
            <section class="read">
              <strong>${x[0]}</strong>
              <p class="muted">${x[1]}</p>
            </section>
          `).join('')}
          <div class="advice">
            <small class="link">오늘의 한 줄 조언</small><br>
            <b>잘해야 한다는 마음 대신,<br>해보자는 마음으로 시작해요.</b>
          </div>
          <p class="note">✓ 보관함에 자동으로 저장했어요</p>
          <button class="btn" data-go="share">오늘의 리딩 공유하기</button>
        </main>
      `;
    }

    // [3] AI 심층 타로 1단계 - 질문 작성
    function question() {
      return top('AI 심층 타로', true) + `
        <main class="main">
          ${progress(1)}
          <h1>어떤 고민을<br>나누고 싶으세요?</h1>
          <p class="muted">마음에 가까운 분야를 골라주세요.</p>
          <div class="chips">
            ${['연애/결혼', '진로/이직', '금전/비즈니스', '인간관계', '학업/시험', '기타'].map(x => `
              <button data-cat="${x}" class="${S.category === x ? 'on' : ''}">${x}</button>
            `).join('')}
          </div>
          <div class="field">
            <label for="q">지금 가장 궁금한 점을 적어주세요</label>
            <textarea id="q" maxlength="300">${S.question}</textarea>
            <p class="muted">이름이나 연락처 같은 개인정보는 적지 않아도 괜찮아요.</p>
          </div>
          <div class="cost">
            <div>
              <b>심층 리딩 1회</b>
              <small>세 장을 고르고 리딩을 요청할 때 차감해요.</small>
            </div>
            <b class="link">10크레딧</b>
          </div>
          <button class="btn" data-go="cards">다음 · 카드 고르기</button>
          <p class="note">아직 크레딧을 사용하지 않았어요</p>
        </main>
      `;
    }

    // [4] AI 심층 타로 2단계 - 카드 고르기
    function cards() {
      return top('AI 심층 타로', true) + `
        <main class="main">
          ${progress(2)}
          <h1>마음이 가는 세 장을<br>모두 골랐어요</h1>
          <p class="muted">카드에 담긴 이야기를 함께 살펴볼까요?</p>
          <div class="panel">
            <b class="link">${S.category}</b>
            <p>${S.question}</p>
          </div>
          <div class="date">
            <b>나의 세 장</b>
            <b class="link">3 / 3 선택 완료</b>
          </div>
          <div class="slots">
            ${['과거', '현재', '미래'].map(x => `
              <div class="slot">
                ✓ ${x}
                ${card()}
              </div>
            `).join('')}
          </div>
          <div class="deck">
            ${[1, 2, 3, 4, 5].map(card).join('')}
          </div>
          <p class="note">78장의 카드에서 나를 위한 세 장을 골랐어요</p>
          <div class="date">
            <span>보유 ${S.credits}크레딧</span>
            <span>사용 후 ${Math.max(S.credits - 10, 0)}크레딧</span>
          </div>
          <button class="btn" id="read">10크레딧으로 리딩 보기</button>
          <p class="note">AI 리딩을 만들지 못하면 자동으로 돌려드려요.</p>
        </main>
      `;
    }

    // [5] AI 심층 타로 3단계 - 리딩 결과
    function result() {
      return top('AI 심층 리딩', true) + `
        <main class="main">
          ${progress(3)}
          <p class="muted">${S.category} · 2026.10.23</p>
          <h1>서두르지 않아도,<br>나의 방향은 찾을 수 있어요</h1>
          <div class="three">
            ${[1, 2, 3].map(card).join('')}
          </div>
          <div class="advice">
            <b>✦ 세 장이 전하는 이야기</b>
            <p class="muted">그동안 쌓은 힘을 바탕으로, 변화를 탐색해 볼 때로 보여요. 내가 원하는 일의 기준부터 적어보면 좋겠어요.</p>
          </div>
          ${[
            ['과거 · 전차', '버텨온 힘을 먼저 인정해 주세요.'],
            ['현재 · 운명의 수레바퀴', '변화를 관찰하고 선택지를 넓혀봐요.'],
            ['미래 · 별', '내가 바라는 기준이 길잡이가 돼요.']
          ].map(x => `
            <section class="read">
              <b class="link">${x[0]}</b>
              <h3>${x[1]}</h3>
              <p class="muted">서두르기보다 지금의 상황과 마음을 함께 살펴보세요.</p>
            </section>
          `).join('')}
          <div class="panel">
            <b>오늘은 이것 하나만 해봐요</b>
            <p class="muted">다음 회사에서 꼭 지키고 싶은 조건 3가지를 적어보세요.</p>
          </div>
          <button class="btn" data-go="share">이 리딩 공유하기</button>
          <button class="btn light" data-go="home" style="margin-top:10px">홈으로 돌아가기</button>
        </main>
      `;
    }

    // [6] 보관함
    function archive() {
      const items = [
        '최근 이직을 고민하고 있어요. 지금 회사에 남는 게 좋을까요?',
        '작은 용기가 하루를 환하게 비춰줄 거예요',
        '잠시 쉬어가도 괜찮아요',
        '친구와 멀어진 것 같아요. 먼저 연락해 볼까요?'
      ];
      return top('보관함') + `
        <main class="main">
          <h1>마음을 들여다본 순간을<br>모아뒀어요</h1>
          <p class="muted">리딩은 따로 저장하지 않아도 여기에 남아요.</p>
          <div class="chips" style="grid-template-columns:repeat(3,1fr)">
            <button class="on">전체</button>
            <button>오늘의 타로</button>
            <button>심층 타로</button>
          </div>
          ${items.map((x, i) => `
            <button class="history" data-go="${i === 1 ? 'daily' : 'result'}">
              <small>${i === 1 ? '오늘의 타로' : '심층 타로'}</small>
              <strong>${x}</strong>
              <span class="muted">2026.10.${23 - i}　›</span>
            </button>
          `).join('')}
        </main>
        ${nav('archive')}
      `;
    }

    // [7] 리딩 공유
    function share() {
      return top('리딩 공유', true) + `
        <main class="main">
          <h1>마음에 남은 이야기를<br>가볍게 나눠보세요</h1>
          <p class="muted">나를 위한 메시지만 담았어요.</p>
          <div class="share">
            <b>타로티카　✦</b>
            <p class="muted" style="margin-top:20px">나를 위한 세 장의 이야기 · 2026.10.23</p>
            <h2>서두르지 않아도,<br>나의 방향은 찾을 수 있어요</h2>
            <div class="three">${[1, 2, 3].map(card).join('')}</div>
            ${S.include ? `<p class="muted">${S.question}</p>` : ''}
            <p style="line-height:1.7;margin-top:25px">정답을 서둘러 정하기보다,<br>내가 원하는 일의 기준부터<br>천천히 적어보면 좋겠어요.</p>
          </div>
          <div class="toggle" id="toggle">
            <span>
              <b>내 질문 포함하기</b>
              <small class="muted" style="display:block">개인 질문은 기본으로 숨겨져요.</small>
            </span>
            <i class="switch ${S.include ? 'on' : ''}"></i>
          </div>
          <div class="row">
            <button class="btn light" id="save">이미지 저장</button>
            <button class="btn" id="share">공유하기</button>
          </div>
        </main>
      `;
    }

    // [8] 크레딧 상점
    function store() {
      return top('크레딧 상점') + `
        <main class="main">
          <div class="balance">
            <span class="muted">지금 보유한 크레딧</span>
            <b>${S.credits}크레딧</b>
            <span class="muted">무료 ${Math.max(S.credits - 5, 0)}　 유료 5</span>
          </div>
          <h2>필요한 만큼 충전해요</h2>
          <p class="muted" style="margin-top:10px">심층 리딩은 한 번에 10크레딧을 사용해요.</p>
          ${[
            [30, '3,300원'],
            [100, '9,900원'],
            [300, '26,400원']
          ].map(x => `
            <button class="product ${S.product === x[0] ? 'on' : ''}" data-product="${x[0]}">
              ○
              <span>
                <b>${x[0]}크레딧</b>
                <small class="muted">심층 리딩 ${Math.floor(x[0] / 10)}회 이용 분량</small>
              </span>
              <b>${x[1]}</b>
            </button>
          `).join('')}
          <div class="read">
            <b>구매 전에 확인해 주세요</b>
            <p class="muted">무료 크레딧부터 먼저 사용해요.<br>구매한 유료 크레딧은 유효기간이 없어요.</p>
          </div>
          <button class="btn" id="buy">${S.product}크레딧 구매하기</button>
          <button class="panel row" data-go="attendance" style="width:100%;border:0;text-align:left">
            <b class="grow">오늘 출석하고 2크레딧 받아요</b>
            ›
          </button>
        </main>
        ${nav('store')}
      `;
    }

    // [9] 출석체크
    function attendance() {
      return top('출석 체크', true) + `
        <main class="main">
          <span class="badge" style="position:static;display:inline-block">2026.10.23 금요일</span>
          <h1 style="margin-top:16px">오늘도 나를 위한<br>작은 습관을 이어가요</h1>
          <p class="muted">5일 연속 출석했어요.<br>오늘은 6일차, 아직 보상을 받지 않았어요.</p>
          <div class="days">
            ${[1, 2, 3, 4, 5, 6, 7].map((x, i) => `
              <div class="day ${x === 6 ? 'today' : ''}">
                ${x === 6 ? '오늘 · 6일차' : x + '일차'}
                <b>${x < 6 ? '✓' : (x === 6 ? '▣' : '+10')}</b>
                ${x < 6 ? '받았어요' : (x === 6 ? '+2크레딧' : '내일')}
              </div>
            `).join('')}
          </div>
          <div class="advice">
            <b>✦　추가 10크레딧까지 한 걸음 더</b>
            <p class="muted">오늘과 내일 출석하면 7일 연속 보상도 함께 받을 수 있어요.</p>
          </div>
          <div class="read">
            <b>차곡차곡 모으는 크레딧</b>
            <p class="muted">매일 출석하면 무료 크레딧 2개를 받아요.<br>출석은 한국 시간 매일 00:00에 새로 시작해요.</p>
          </div>
          <button class="btn" id="claim" ${S.claimed ? 'disabled' : ''}>
            ${S.claimed ? '오늘 수령 완료' : '2크레딧 받기'}
          </button>
          <p class="note">현재 잔액 ${S.credits}크레딧</p>
        </main>
      `;
    }

    // 뷰 매핑 테이블
    const views = { home, daily, question, cards, result, archive, share, store, attendance };

    // 화면 렌더링 함수
    function render() {
      const appEl = document.querySelector('#app');
      if (appEl && views[S.screen]) {
        appEl.innerHTML = `<div class="app">${views[S.screen]()}</div>`;
      }
    }

    // 토스트 팝업 함수
    function toast(message) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();

      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = message;
      document.body.append(el);
      setTimeout(() => el.remove(), 1800);
    }

    // 전역 클릭 이벤트 위임
    document.addEventListener('click', (e) => {
      // 화면 이동
      const goTarget = e.target.closest('[data-go]');
      if (goTarget) {
        S.screen = goTarget.dataset.go;
        window.scrollTo(0, 0);
        render();
        return;
      }

      // 질문 카테고리 선택
      const catTarget = e.target.closest('[data-cat]');
      if (catTarget) {
        S.category = catTarget.dataset.cat;
        render();
        return;
      }

      // 충전 상품 선택
      const productTarget = e.target.closest('[data-product]');
      if (productTarget) {
        S.product = Number(productTarget.dataset.product);
        render();
        return;
      }

      // 심층 리딩 실행 (10 크레딧 차감)
      if (e.target.closest('#read')) {
        if (S.credits >= 10) {
          S.credits -= 10;
          S.screen = 'result';
          window.scrollTo(0, 0);
          render();
        } else {
          toast('크레딧이 부족해요. 상점에서 충전해 주세요.');
        }
        return;
      }

      // 공유 옵션 질문 포함 토글
      if (e.target.closest('#toggle')) {
        S.include = !S.include;
        render();
        return;
      }

      // 크레딧 구매 (시뮬레이션)
      if (e.target.closest('#buy')) {
        S.credits += S.product;
        toast(`${S.product}크레딧이 충전됐어요`);
        render();
        return;
      }

      // 출석 보상 받기
      if (e.target.closest('#claim') && !S.claimed) {
        S.claimed = true;
        S.credits += 2;
        toast('2크레딧을 받았어요');
        render();
        return;
      }

      // 이미지 저장 버튼
      if (e.target.closest('#save')) {
        toast('이미지를 저장했어요');
        return;
      }

      // 공유하기 버튼 (Web Share API 연동)
      if (e.target.closest('#share')) {
        if (navigator.share) {
          navigator.share({
            title: '타로티카',
            text: '서두르지 않아도, 나의 방향은 찾을 수 있어요',
            url: window.location.href
          }).catch(() => {});
        } else {
          toast('공유 링크가 준비됐어요');
        }
      }
    });

    // 입력 필드 바인딩
    document.addEventListener('input', (e) => {
      if (e.target.id === 'q') {
        S.question = e.target.value;
      }
    });

    // 초기 렌더링
    render();
  </script>
</body>
</html>
